<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Image</title>
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/search.css">

 
</head>
<body>
    <!-- Bindawa task navbar -->

    <div class="hero">

        <div class="content">
            <h1>" Vector Villa "</h1>
            <form action="">
            <div class="form-container">
            <div class="labelcontainer">
                <label for="">Destination</label>
                <div class="search-box">
                    <input type="text" id="searchInput">
                    <input type="text" id="place" value="all">
                    <div class="dropdown" id="dropdown">
                        <div class="giza">giza</div>
                        <div class="cairo">cairo</div>
                        <div class="alex">alex</div>
                        <div class="aswan">aswan</div>
                    </div>
                </div>
            </div>
            <div class="labelcontainer">
                <label for="">Check-in</label>
                <div class="search-box">
                    <input id="checkininput" type="date" lang="ar-EG">
                </div>
            </div>
            <div class="labelcontainer">
                <label for="">Check-out</label>
                <div class="search-box">
                    <input id="checkoutinput" type="date" lang="ar-EG">
                </div>
            </div>
            <div class="labelcontainer">
                <label for="">Rooms</label>
                <div class="number-box">
                    <input id="number-input" type="number" placeholder="number of rooms.">
                </div>
                <!-- <button type="button" value="search" onclick="search()">search</button> -->
            </div>
            <div onclick="search()" id="searchBtn">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
                   <circle cx="11" cy="11" r="8"></circle>
                   <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
        </div>
    </form>
            <!-- <h4 id="offer">Travel adds upStay 10 nights, get a   
            reward night to use however you like.
            </h4>   -->
            <!-- <a href="" class="go">Get Started</a> -->
        </div>    
        
  

    </div>

    <script src="js/search.js"></script>
    
</body>
</html>
