<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <header>
        <!-- Bindawa task start navbar -->
        this is Bindawa task navbar
        <!-- Bindawa task end navbar -->
    </header>

    <main>
        <div class="container">
            <h1>Profile</h1>
            <form action="" class="model" method="post">
                <fieldset class="structure">
                    <div class="photo-section">
                        <img src="images/account.png" alt="Personal photo" class="photo">
                        <input type="file" class="hidden-upload">    <!-- Hidden file input -->
                        <button type="button" class="photo-custom-btn" >Update Photo</button>     <!-- Custom button to trigger file input -->
                    </div>
                    <div class="form-row">
                        <div class="name-section">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" required readonly>
                            <small class="error-msg"></small>
                            <button type="button" class="custom-btn">Edit</button>
                        </div>
                        <div class="name-section">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" required readonly>
                            <small class="error-msg"></small>
                            <button type="button" class="custom-btn">Edit</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="pass-section">
                            <label for="password">Password</label>
                            <input type="password" id="password" required readonly>
                            <small class="error-msg" style="color: red;"></small>
                            <button type="button" class="custom-btn">Edit</button>
                            <button type="button" class="custom-btn">Show</button>
                        </div>
                        <div class="mail-section">
                            <label for="email">Email</label>
                            <input type="email" id="email" required readonly>
                            <small class="error-msg" style="color: red;"></small>
                            <button type="button" class="custom-btn">Edit</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="ID-section">
                            <label for="idNumber">National ID</label>
                            <input type="text" id="idNumber" required readonly>
                            <small class="error-msg" style="color: red;"></small>
                            <button type="button" class="custom-btn">Edit</button>
                        </div>
                        <div class="date-section">
                            <label for="birth">Date of Birth</label>
                            <input type="date" id="birth" readonly>
                            <small class="error-msg" style="color: red;"></small>
                            <button type="button" class="custom-btn">Edit</button>
                        </div>
                    </div>
                    <div>
                        <button type="button" class="custom-btn">Save changes</button>
                    </div>
                </fieldset>
            </form>
            <div class="action-btns">
                <button type="button" class="design">Logout</button>
                <button type="button" class="design">Delete account</button>
            </div>
        </div>
        <script src="profile.js"></script>
    </main>

    <footer>

        <!-- Nasser task start footer -->
            this is Nasser task footer
        <!-- Nasser task end footer -->

    </footer>
</body>
</html>
<!-- ashraf task end profile -->
